[package]
name = "pe-online"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
pe-analysis = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
pe-db = { workspace = true }

# VirusTotal key: macOS Keychain, Linux Secret Service (pure-Rust D-Bus) with the kernel keyring
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native-async-persistent", "async-io", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
pe-parser = { workspace = true }
