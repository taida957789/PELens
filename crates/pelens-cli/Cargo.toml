[package]
name = "pelens-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
pe-db = { workspace = true }
pe-analysis = { workspace = true }
pe-online = { workspace = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "pelens-cli"
path = "src/main.rs"

[dev-dependencies]
pe-parser = { workspace = true }

[build-dependencies]
winresource = "0.1"

[features]
default = ["yara"]
# YARA rule scanning (YARA-X, about +20 MB). Build without it: cargo build --release --no-default-features
yara = ["pe-analysis/yara"]
