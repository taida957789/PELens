[package]
name = "pelens-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
pe-parser = { workspace = true }
pe-db = { workspace = true }
pe-analysis = { workspace = true }
pe-online = { workspace = true }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "accesskit", "x11", "wayland"] }
# file dialogs: XDG desktop portal on Linux (no GTK needed)
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"
# same version as epaint: read font metrics to align fallback fonts
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[target.'cfg(not(windows))'.dependencies]
# interface language: macOS preferred languages (CFLocale), LC_ALL / LANG elsewhere
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "pelens"
path = "src/main.rs"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu"] }
pe-analysis = { workspace = true }
pe-parser = { workspace = true }
pe-db = { workspace = true }
pe-online = { workspace = true }

[build-dependencies]
winresource = "0.1"

[features]
default = ["yara"]
# YARA rule scanning (YARA-X, about +20 MB). Build without it: cargo build --release --no-default-features
yara = ["pe-analysis/yara"]
