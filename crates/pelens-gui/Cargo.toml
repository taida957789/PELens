[package]
name = "pelens-gui"
version.workspace = true
edition.workspace = true

[dependencies]
pe-parser = { workspace = true }
pe-db = { workspace = true }
pe-analysis = { workspace = true }
pe-online = { workspace = true }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "accesskit"] }
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pelens"
path = "src/main.rs"

[dev-dependencies]
egui_kittest = "0.36"
pe-analysis = { workspace = true }
pe-parser = { workspace = true }
pe-db = { workspace = true }
pe-online = { workspace = true }

[build-dependencies]
winresource = "0.1"
