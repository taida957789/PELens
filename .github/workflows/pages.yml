name: Pages

# The website (site/) with the logo and the screenshots of the README.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/screenshots/**', 'assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/assets _site/screenshots
          cp -r site/* _site/
          cp assets/pelens.png assets/pelens-512.png _site/assets/
          cp docs/screenshots/*.png _site/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
