[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
pe-parser = { path = "crates/pe-parser" }
pe-db = { path = "crates/pe-db" }
pe-analysis = { path = "crates/pe-analysis", default-features = false }
pe-online = { path = "crates/pe-online" }
quick-xml = "0.37"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
msvc-demangler = "0.10"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
# no symbol table in the .exe (debug information stays in the .pdb)
strip = "symbols"

